<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Kaggle Classic</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main id="popup-row" class="popup-row" title="Загрузка настройки…">
      <h1 id="popup-title"><span class="kaggle-word" role="img" aria-label="Kaggle"><img class="logo-legacy" src="assets/legacy-logo.svg" alt="" aria-hidden="true"><img class="logo-current" src="assets/current-logo-dark.svg" alt="" aria-hidden="true"></span> <span>Classic</span></h1>
      <button id="enabled" type="button" role="switch" aria-checked="true" aria-labelledby="popup-title" disabled title="Загрузка настройки…">
        <span id="toggle-label" aria-hidden="true">On</span>
      </button>
      <span id="status" class="visually-hidden" role="status" aria-live="polite">Загрузка настройки…</span>
    </main>
  </body>
</html>
